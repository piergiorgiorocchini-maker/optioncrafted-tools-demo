name: FDVE five-company SEC mapping audit
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Check normalized model
        run: node --test platform-app/scripts/fdve-model.test.mjs
      - name: Audit five SEC sources
        env:
          SEC_USER_AGENT: OptionsCrafted piergiorgio.rocchini@gmail.com
        run: node platform-app/scripts/audit-fdve-cluster.mjs
      - name: Commit audit report only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add platform-app/reports/fdve-cluster-sec-coverage.json
          if ! git diff --cached --quiet; then
            git commit -m "data: five-company SEC taxonomy audit"
            git push
          fi
