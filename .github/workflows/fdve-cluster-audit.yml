name: FDVE five-company cross-sector audit
on:
  workflow_dispatch:
  push:
    paths:
      - 'platform-app/scripts/fdve-cluster-*.mjs'
      - 'platform-app/config/fdve-sector-profiles.json'
      - '.github/workflows/fdve-cluster-audit.yml'
permissions:
  contents: write
concurrency:
  group: fdve-cluster-audit
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: FDVE regression tests
        run: |
          node --test platform-app/scripts/fdve-model.test.mjs
          node --test platform-app/scripts/fdve-cluster-mapping.test.mjs
      - name: Period-aligned SEC and FMP audit
        env:
          SEC_USER_AGENT: OptionsCrafted piergiorgio.rocchini@gmail.com
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
        run: node platform-app/scripts/fdve-cluster-v2.mjs
      - name: Commit audit report only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add platform-app/reports/fdve-cluster-v2.json
          if ! git diff --cached --quiet; then
            git commit -m "data: five-company FDVE fiscal coverage and reconciliation"
            for attempt in 1 2 3; do
              git fetch origin main
              git rebase -X theirs origin/main
              if git push origin HEAD:main; then exit 0; fi
              sleep 2
            done
            echo "Could not push audit report after 3 attempts" >&2
            exit 1
          fi
