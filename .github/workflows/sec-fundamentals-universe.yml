name: SEC fundamentals universe backfill
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/sec-fundamentals-universe.yml"
      - ".github/scripts/backfill-sec-universe.mjs"
      - ".github/sec-ticker-batch.txt"
      - "platform-app/scripts/normalize-sec-raw-snapshot.mjs"
  schedule:
    - cron: "20 4 * * 1-5"
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: sec-fundamentals-universe-backfill
  cancel-in-progress: false
jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && github.sha || 'main' }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Select configured SEC ticker batch
        if: github.event_name == 'push'
        env:
          BEFORE_SHA: ${{ github.event.before }}
          EVENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          batch_file_changed=false
          if [[ "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ]]; then
            if ! git cat-file -e "${BEFORE_SHA}^{commit}"; then
              echo "Push base commit $BEFORE_SHA is unavailable; refusing to run the full universe accidentally." >&2
              exit 1
            fi
            if git diff --name-only "$BEFORE_SHA" "$EVENT_SHA" -- .github/sec-ticker-batch.txt | grep -qx '.github/sec-ticker-batch.txt'; then
              batch_file_changed=true
            fi
          fi
          if [[ "$batch_file_changed" == "true" ]]; then
            batch="$(awk 'NF && $1 !~ /^#/ {print toupper($1)}' .github/sec-ticker-batch.txt | paste -sd, -)"
            if [[ -z "$batch" ]]; then
              echo "The SEC batch file changed but contains no tickers." >&2
              exit 1
            fi
            printf 'SEC_TICKER_BATCH=%s\n' "$batch" >> "$GITHUB_ENV"
            printf 'Selected SEC ticker batch: %s\n' "$batch"
          fi
      - name: Download SEC Company Facts and update Google Sheets raw data
        env:
          SEC_USER_AGENT: OptionsCrafted piergiorgio.rocchini@gmail.com
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          OPTIONSCRAFTED_SHEET_ID: 1Qw5cxoUEwGKExwWv3IRRSyiWvCykZFdfFfqKs3FVrgw
        run: node .github/scripts/backfill-sec-universe.mjs
      - name: Normalize annual valuation facts
        run: node platform-app/scripts/normalize-sec-raw-snapshot.mjs
      - name: Commit refreshed admin coverage snapshot
        id: publish_snapshot
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add platform-app/src/data/adminCoverageSnapshot.json platform-app/src/data/googleSheetsSecFacts.json platform-app/src/data/googleSheetsSecAnnual.json
          echo "changed=false" >> "$GITHUB_OUTPUT"
          if git diff --cached --quiet; then
            echo "Coverage snapshot is unchanged."
            exit 0
          fi
          git commit -m "data(admin): refresh ticker coverage snapshot"
          for attempt in 1 2 3; do
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort
              echo "Could not rebase snapshot update safely." >&2
              exit 1
            fi
            if git push origin HEAD:main; then
              echo "changed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 3
          done
          echo "Could not publish coverage snapshot after three attempts." >&2
          exit 1
      - name: Rebuild the static platform preview
        if: steps.publish_snapshot.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run build-platform-preview.yml --ref main
