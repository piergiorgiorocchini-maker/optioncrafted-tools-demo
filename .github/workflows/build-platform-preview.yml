name: Build OptionsCrafted app preview
on:
  push:
    branches: [main]
    paths:
      - "platform-app/**"
      - ".github/workflows/build-platform-preview.yml"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: platform-preview-build
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        working-directory: platform-app
        run: npm install --no-audit --no-fund
      - name: Validate and build
        working-directory: platform-app
        run: npm run build
      - name: Upload compiled preview for debugging
        uses: actions/upload-artifact@v4
        with:
          name: optioncrafted-react-preview
          path: platform-app/dist
          if-no-files-found: error
      - name: Publish static preview within repository
        run: |
          mkdir -p platform-preview
          find platform-preview -mindepth 1 -maxdepth 1 -exec rm -rf {} +
          cp -R platform-app/dist/. platform-preview/
          touch platform-preview/.nojekyll
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A platform-preview
          echo 'Built preview files:'
          find platform-preview -maxdepth 2 -type f | sort | head -30
          if ! git diff --cached --quiet; then
            git commit -m "chore: update OptionsCrafted app preview [skip ci]"
            git push
          fi
