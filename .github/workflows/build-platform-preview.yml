name: Build OptionsCrafted app preview
on:
  push:
    branches: [main]
    paths:
      - "platform-app/**"
      - ".github/workflows/build-platform-preview.yml"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: platform-preview-build
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        working-directory: platform-app
        run: npm install --no-audit --no-fund
      - name: Validate and build
        working-directory: platform-app
        run: npm run build
      - name: Upload compiled preview for debugging
        uses: actions/upload-artifact@v4
        with:
          name: optioncrafted-react-preview
          path: platform-app/dist
          if-no-files-found: error
      - name: Publish static preview within repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Preview files are generated. Never rebase a generated preview
          # commit over another generated preview commit: asset hashes conflict.
          # Keep the compiled dist (ignored by git) and commit it on top of
          # the newest main. Retry if another push lands during publication.
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            rm -rf platform-preview
            mkdir -p platform-preview
            cp -R platform-app/dist/. platform-preview/
            touch platform-preview/.nojekyll
            git add -A platform-preview
            if git diff --cached --quiet; then
              echo "Preview is already current."
              exit 0
            fi
            git commit -m "chore: update OptionsCrafted app preview [skip ci]"
            if git push origin HEAD:main; then
              echo "Published compiled preview."
              exit 0
            fi
            echo "Preview push raced with another commit; retrying."
            sleep 2
          done
          echo "Failed to publish preview after three attempts." >&2
          exit 1
