name: FDVE live SEC Alpha Vantage reconciliation
on:
  workflow_dispatch:
  push:
    paths:
      - 'platform-app/scripts/fdve-alpha-vantage-reconcile.mjs'
      - '.github/workflows/fdve-alpha-vantage-reconcile.yml'
permissions:
  contents: write
concurrency:
  group: fdve-alpha-vantage-reconcile
  cancel-in-progress: false
jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Reconcile SEC and Alpha Vantage annual statements
        env:
          ALPHAVANTAGE_API_KEY: ${{ secrets.ALPHAVANTAGE_API_KEY }}
        run: node platform-app/scripts/fdve-alpha-vantage-reconcile.mjs
      - name: Commit reconciled public report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add platform-app/reports/fdve-alpha-vantage-aapl.json
          if ! git diff --cached --quiet; then
            git commit -m "data: AAPL SEC Alpha Vantage reconciliation"
            for attempt in 1 2 3; do
              git fetch origin main
              git rebase -X theirs origin/main
              if git push origin HEAD:main; then exit 0; fi
              sleep 2
            done
            exit 1
          fi
