name: SEC fundamentals pilot (AAPL)
on:
  workflow_dispatch:
  schedule:
    - cron: '37 7 * * 1-5'
permissions:
  contents: write
  issues: write
concurrency:
  group: sec-fundamentals-pilot
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: FDVE normalized model regression tests
        run: node --test platform-app/scripts/fdve-model.test.mjs
      - name: Fetch SEC companyfacts
        env:
          SEC_USER_AGENT: OptionsCrafted piergiorgio.rocchini@gmail.com
        run: node platform-app/scripts/update-sec-aapl.mjs
      - name: Validate SEC data integrity
        run: node platform-app/scripts/validate-sec-aapl.mjs --report
      - name: Import into Google Sheets
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          OPTIONSCRAFTED_SHEET_ID: 1Qw5cxoUEwGKExwWv3IRRSyiWvCykZFdfFfqKs3FVrgw
        run: node platform-app/scripts/import-sec-sheets.mjs
      - name: Commit verified snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add platform-app/src/data/sec/aapl.json platform-app/src/data/sec/aapl-validation.json
          if ! git diff --cached --quiet; then
            git commit -m "data: refresh AAPL SEC fundamentals"
            git push
          fi

      - name: Notify persistent pipeline failure
        if: ${{ failure() }}
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          TITLE="[FDVE] SEC AAPL pipeline failure"
          EXISTING=$(gh issue list --state open --search "$TITLE in:title" --json number,title --jq '.[] | select(.title == "[FDVE] SEC AAPL pipeline failure") | .number' | head -n 1)
          BODY="SEC AAPL pipeline failed. Last known valid data remains unchanged. Check the workflow logs: $RUN_URL"
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body "$BODY"
          else
            gh issue create --title "$TITLE" --body "$BODY"
          fi
      - name: Resolve persistent pipeline alert
        if: ${{ success() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TITLE="[FDVE] SEC AAPL pipeline failure"
          EXISTING=$(gh issue list --state open --search "$TITLE in:title" --json number,title --jq '.[] | select(.title == "[FDVE] SEC AAPL pipeline failure") | .number' | head -n 1)
          if [ -n "$EXISTING" ]; then
            gh issue close "$EXISTING" --comment "SEC AAPL pipeline recovered and completed successfully."
          fi
